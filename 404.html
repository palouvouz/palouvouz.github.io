<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Lost in the Void</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style src="./style.css"></style>
</head>
<body>

    <canvas id="star-canvas"></canvas>
    <div class="scanlines"></div>

    <div class="card">
        <div class="glitch-wrapper">
            <div class="glitch" data-text="404">404</div>
        </div>

        <h1>ΧΑΘΗΚΑΤΕ ΣΤΟ ΚΕΝΟ;</h1>
        
        <div id="terminal" class="terminal-log">
            > ERR_LOCATION_NOT_FOUND<br>
            > SECTOR_UNREACHABLE...
        </div>

        <p>Η σελίδα που αναζητάτε έχει καταρρεύσει σε μια μαύρη τρύπα ή δεν υπήρξε ποτέ στο δικό μας σύμπαν.</p>

        <a href="https://palouvouz.github.io/" class="back-btn">
            <i class="fa-solid fa-house-signal"></i> Επιστροφη στη Βαση
        </a>
    </div>

    <script>
        // --- SPACE WARP CANVAS ---
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const numStars = 200;

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    z: Math.random() * canvas.width,
                    o: '0.' + Math.floor(Math.random() * 99) + 1
                });
            }
        }

        function draw() {
            ctx.fillStyle = '#010103';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#fff';
            for (let i = 0; i < numStars; i++) {
                let star = stars[i];
                let x = (star.x - canvas.width / 2) * (canvas.width / star.z);
                x += canvas.width / 2;
                let y = (star.y - canvas.height / 2) * (canvas.width / star.z);
                y += canvas.height / 2;
                let s = 1.5 * (canvas.width / star.z);

                ctx.beginPath();
                ctx.arc(x, y, s / 2, 0, Math.PI * 2);
                ctx.fill();

                star.z -= 5;
                if (star.z <= 0) {
                    star.z = canvas.width;
                }
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        init();
        draw();

        // --- TERMINAL LOG ANIMATION ---
        const terminal = document.getElementById('terminal');
        const logs = [
            "> INITIALIZING SEARCH PROTOCOL...",
            "> ERROR: SECTOR_404_VOID_DETECTED",
            "> DATA_STREAM_INTERRUPTED",
            "> ATTEMPTING_RECOVERY...",
            "> RECOVERY_FAILED_UNABLE_TO_LOCATE",
            "> SYSTEM_ADVISORY: RETURN_HOME"
        ];
        let currentLog = 0;

        setInterval(() => {
            terminal.innerHTML = `> ${logs[currentLog]}<br>> ${logs[(currentLog + 1) % logs.length]}`;
            currentLog = (currentLog + 1) % logs.length;
        }, 2000);
    </script>
</body>
</html>
