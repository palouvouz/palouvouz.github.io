<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Αυτό το βιβλίο ανήκει στον Πανταζή Λούκα Βουζαξάκη</title>
<style>
  :root {
    --bg: #fafaf7;
    --text: #1c1c1c;
    --muted: #5a5a5a;
    --accent: #90D5FF;
    --line: #dcdcd5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --text: #f0f0ea;
      --muted: #a8a8a0;
      --accent: #5fc08f;
      --line: #333330;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 480px; }
  .label {
    color: var(--muted);
    font-size: 1rem;
    margin: 0 0 8px;
  }
  h1 {
    font-size: 1.9rem;
    line-height: 1.3;
    margin: 0 0 24px;
  }
  h1 span { color: var(--accent); }
  p { margin: 0 0 24px; }
  .contact {
    border-top: 1px solid var(--line);
  }
  .contact a {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    text-decoration: none;
    font-size: 1.1rem;
  }
  .contact a span:first-child { color: var(--muted); }
  .contact a span:last-child { color: var(--accent); font-weight: 600; }
  .contact a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="label">Αυτό το βιβλίο ανήκει στον</p>
  <h1><span>Πανταζή Λούκα Βουζαξάκη</span></h1>
  <p>Αν το βρήκες, θα με βοηθήσεις πολύ αν επικοινωνήσεις μαζί μου για να το πάρω πίσω. Ευχαριστώ!</p>

  <div class="contact">
    <a href="tel:+306945193420">
      <span>Τηλέφωνο</span>
      <span>69 45 1934 20</span>
    </a>
    <a href="https://www.instagram.com/palouvouz" target="_blank" rel="noopener">
      <span>Instagram</span>
      <span>@palouvouz</span>
    </a>
  </div>
</main>
</body>
</html>
